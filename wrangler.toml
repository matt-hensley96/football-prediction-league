name = "football-score-predictor"
main = "src/index.ts"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "./public"
binding = "ASSETS"

[vars]
# The "From" address Resend sends as. Must be on a domain you've verified with Resend.
EMAIL_FROM = "predictor@example.com"
# Public URL of the deployed Worker, linked to from reminder emails. Update once you know your
# *.workers.dev URL (or custom domain).
APP_URL = "https://football-score-predictor.example.workers.dev"

[[d1_databases]]
binding = "DB"
database_name = "football-score-predictor"
database_id = "2126719e-e7bf-4842-9b97-6f8cd778b97b"

[triggers]
# Two schedules, distinguished in src/index.ts's `scheduled` handler by controller.cron —
# keep that check in sync if either of these strings changes.
# "0 8 * * *"     -> once a day: open/lock/score gameweeks (src/cron/handler.ts)
# "*/15 * * * *"  -> every 15 min: send 24h/3h-before-deadline reminder emails (src/cron/reminders.ts)
crons = ["0 8 * * *", "*/15 * * * *"]