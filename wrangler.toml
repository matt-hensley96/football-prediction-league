name = "football-score-predictor"
main = "src/index.ts"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "./public"
binding = "ASSETS"

[vars]
# Public URL of the deployed Worker, linked to from reminder emails. Update once you know your
# *.workers.dev URL (or custom domain).
APP_URL = "https://football-score-predictor.mh96.workers.dev"

# EMAIL_FROM is set as a secret (`wrangler secret put EMAIL_FROM`), not a plain var here, since
# it's a personal address you may not want committed to a public repo. Must be a sender verified
# with Brevo (single sender verification - no domain/DNS setup required).

[[d1_databases]]
binding = "DB"
database_name = "football-score-predictor"
database_id = "2126719e-e7bf-4842-9b97-6f8cd778b97b"

[triggers]
# Distinguished in src/index.ts's `scheduled` handler by controller.cron — keep that in sync
# if any of these strings changes.
# "0 8 * * *"    -> Daily (at 8am): lock deadlines, score finished fixtures, open next gameweek
#                  (src/cron/handler.ts), then send missing-pick reminder emails (src/cron/reminders.ts).
#                  Between runs the site itself keeps the state fresh via POST /api/sync (src/api/sync.ts).
# "0 9 * * 1"    -> Weekly (at 9am on Mondays): deactivate inactive accounts, season summary (src/cron/cleanup-users.ts)
crons = ["0 8 * * *", "0 9 * * 1"]